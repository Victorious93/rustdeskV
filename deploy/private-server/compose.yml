# Native RustDesk clients only. The wrapper validates and supplies these values.
services:
  hbbs:
    image: ${RUSTDESKV_SERVER_IMAGE:?run serverctl configure}
    command: ["hbbs", "-k", "_", "-r", "${RUSTDESKV_BIND_IP:?run serverctl configure}:21117"]
    ports:
      - "${RUSTDESKV_BIND_IP}:21115:21115/tcp"
      - "${RUSTDESKV_BIND_IP}:21116:21116/tcp"
      - "${RUSTDESKV_BIND_IP}:21116:21116/udp"
    volumes:
      - ./state/data:/root
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  hbbr:
    image: ${RUSTDESKV_SERVER_IMAGE:?run serverctl configure}
    command: ["hbbr", "-k", "_"]
    ports:
      - "${RUSTDESKV_BIND_IP}:21117:21117/tcp"
    volumes:
      - ./state/data:/root
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
